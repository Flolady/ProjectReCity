    <circle cx="128" cy="132" r="62" fill="url(#sun)"/>
    <!-- skyline -->
    <path fill="#0a0d1f" d="M8 168 V140 h14 v-18 h10 v18 h8 V110 h16 v58 h6 V128 h12 v-14 h8 v14 h6 v40 h10 V92 l9 -10 l9 10 v76 h8 V120 h14 v-8 h10 v8 h6 v48 h8 V104 h18 v64 h8 V134 h12 v-12 h10 v46 h10 V146 h8 v22 z"/>
    <!-- lit windows -->
    <g fill="#25e0d0" opacity="0.85">
      <rect x="44" y="118" width="4" height="4"/><rect x="44" y="130" width="4" height="4"/><rect x="50" y="142" width="4" height="4"/>
      <rect x="110" y="98" width="4" height="4"/><rect x="118" y="110" width="4" height="4"/><rect x="110" y="126" width="4" height="4"/>
      <rect x="118" y="142" width="4" height="4"/><rect x="186" y="112" width="4" height="4"/><rect x="194" y="128" width="4" height="4"/>
      <rect x="186" y="146" width="4" height="4"/>
    </g>
    <!-- ground grid -->
    <rect x="0" y="168" width="256" height="88" fill="#090b1a"/>
    <g stroke="url(#grid)" stroke-width="1.6" fill="none">
